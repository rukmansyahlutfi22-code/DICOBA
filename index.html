<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Desa Tanjung Nyiur</title>
    <style>
        body { background-color: #e0e0e0; margin: 0; display: flex; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .app-container { background-color: #fce38a; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .logo { width: 60px; margin-bottom: 5px; }
        h2 { font-size: 1.1rem; margin: 5px 0; }
        #jam { font-size: 1.8rem; font-weight: bold; margin: 5px 0; }
        .camera-box { background-color: #00b4f8; height: 150px; display: flex; align-items: center; justify-content: center; color: white; border-radius: 10px; margin: 15px 0; }
        .btn-absensi { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-absensi button { flex: 1; padding: 12px; border: none; border-radius: 5px; color: white; font-weight: bold; }
        .btn-masuk { background-color: #00b4f8; }
        .btn-pulang { background-color: #e032d6; }
        .btn-menu { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background-color: #00b4f8; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Logo_of_the_Ministry_of_Villages_of_the_Republic_of_Indonesia.svg/1200px-Logo_of_the_Ministry_of_Villages_of_the_Republic_of_Indonesia.svg.png" class="logo">
    <h2>ABSENSI DESA TANJUNG NYIUR</h2>
    <div id="jam">00:00:00</div>
    <div id="tanggal">Minggu, 21 Juni 2026</div>

    <div class="camera-box">TEMPAT PENGAMBILAN GAMBAR</div>

    <div class="btn-absensi">
        <button class="btn-masuk">ABSEN MASUK</button>
        <button class="btn-pulang">ABSEN PULANG</button>
    </div>

    <button class="btn-menu" onclick="alert('Menu Data Perangkat')">Data Perangkat</button>
    <button class="btn-menu" onclick="alert('Menu Riwayat')">Riwayat Absen</button>
    <button class="btn-menu" onclick="alert('Menu Laporan')">Laporan Absen</button>
</div>

<script>
    setInterval(() => {
        document.getElementById('jam').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
