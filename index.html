<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        body { background-color: #fce38a; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background-color: #fce38a; width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 100px; margin-bottom: 10px; }
        h2 { margin: 5px 0; }
        .jam { font-size: 2rem; font-weight: bold; margin-bottom: 5px; }
        
        /* Area Kamera */
        .camera-box { background-color: #00b4f8; height: 200px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin: 20px 0; border-radius: 5px; }
        
        /* Tombol */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-masuk { background-color: #00b4f8; color: white; }
        .btn-pulang { background-color: #e032d6; color: white; }
        .btn-menu { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #00b4f8; color: white; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo_desa.png" class="logo" alt="Logo Desa">
    <h2>ABSENSI DESA TANJUNG NYIUR</h2>
    <div class="jam" id="jam">14:47:56</div>
    <div id="tanggal">Minggu, 21 Juni 2026</div>

    <div class="camera-box" id="camera-area">TEMPAT PENGAMBILAN GAMBAR</div>

    <div class="btn-group">
        <button class="btn-masuk" onclick="aktifkanKamera()">ABSEN MASUK</button>
        <button class="btn-pulang" onclick="aktifkanKamera()">ABSEN PULANG</button>
    </div>

    <button class="btn-menu">Data Perangkat</button>
    <button class="btn-menu">Riwayat Absen</button>
    <button class="btn-menu">Laporan Absen</button>
</div>

<script>
    // Update Jam Realtime
    setInterval(() => {
        document.getElementById('jam').innerText = new Date().toLocaleTimeString();
    }, 1000);

    function aktifkanKamera() {
        alert("Mengaktifkan Kamera...");
        // Logika akses kamera akan dimasukkan di sini
    }
</script>

</body>
</html>
